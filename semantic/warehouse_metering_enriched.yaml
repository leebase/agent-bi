verified_queries:
- name: credits_by_cost_center
  question: credits by cost center
  verified_at: 1792193821
  verified_by: sprint-6
  sql: |-
    SELECT
      "cost_center" AS "cost_center",
      SUM("credits_used") AS "total_credits_used"
    FROM "VIEWS"."MAIN"."warehouse_metering_enriched"
    WHERE 1=1
    GROUP BY "cost_center"
    ORDER BY "total_credits_used" DESC, "cost_center" ASC
    LIMIT 1000
- name: credits_by_size_by_month
  question: credits by warehouse size by month
  verified_at: 1792193821
  verified_by: sprint-6
  sql: |-
    SELECT
      "warehouse_size" AS "warehouse_size",
      DATE_TRUNC('month', "usage_day") AS "time_bucket",
      SUM("credits_used") AS "total_credits_used"
    FROM "VIEWS"."MAIN"."warehouse_metering_enriched"
    WHERE 1=1
    GROUP BY "warehouse_size", "time_bucket"
    ORDER BY "time_bucket" ASC, "total_credits_used" DESC, "warehouse_size" ASC
    LIMIT 1000
