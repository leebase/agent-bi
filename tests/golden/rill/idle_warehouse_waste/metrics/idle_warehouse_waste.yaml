type: metrics_view
display_name: idle_warehouse_waste
model: idle_warehouse_waste
timeseries: usage_day
first_day_of_week: 1
explore:
  skip: true
dimensions:
  - name: warehouse_name
    column: warehouse_name
measures:
  - name: row_count
    expression: COUNT(*)
  - name: total_credits_used_compute
    expression: SUM("credits_used_compute")
  - name: avg_credits_used_compute
    expression: AVG("credits_used_compute")
  - name: total_credits_used_cloud_services
    expression: SUM("credits_used_cloud_services")
  - name: avg_credits_used_cloud_services
    expression: AVG("credits_used_cloud_services")
  - name: total_credits_used
    expression: SUM("credits_used")
  - name: avg_credits_used
    expression: AVG("credits_used")
  - name: distinct_warehouse_name
    expression: COUNT(DISTINCT "warehouse_name")
