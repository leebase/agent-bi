# FROZEN resolver contract cases (agent-bi architecture §5.15, frozen 2026-10-15, D414; tag resolve-contract-frozen-20261015).
# Source: the Sprint 4P rule reviewer's text-only derivations, cases-r5.yaml (171 entries: 170 single-call + the Q16 sequence),
# whose expectations are kept unchanged. Mechanically added by the supervisor after the freeze, from the two reviewer sentences
# adopted verbatim: (A5-1) every ambiguity candidate as {value, kind, description} — kind = the object's kind or "grain" for an
# @grain candidate; description = the object's YAML description or "" (inline models have none; every @grain candidate);
# (A5-2) for RESOLVED: the complete semantic_query (schema_version "semantic-query/1.0", model, table, metrics, dimensions, time
# only when settled; filters/named_filters/order_by/limit absent) and query_hash = agent_bi.query.contract.query_hash(semantic_query)
# (Sprint 2 implementation, independently reviewed).
# Inline-model convention (test harness, not contract): an inline model keyed K is materialized as model name k (lower-case) with
# one table named t_k; objects as listed; no descriptions.
# Implementations must reproduce every field below; a mismatch is a finding (FAIL-OPEN), never an edit to this file.
# OWNER AMENDMENT D417 (2026-10-15, tag resolve-contract-amended-20261015): rows ROW42–ROW44 now use the committed fixtures
# tests/fixtures/semantic/rv5.yaml and rv6.yaml (the inline rv5/rv6 stand-ins are removed; table, query_hash and candidate
# descriptions recomputed from the fixtures); cases AMD1–AMD4 added (grain collapse; failure removes result; per-occurrence
# unmatched words; per-match rule-6 entries). A sequence step may carry its own `model` (AMD2 uses a missing model `nosuch`).
# OWNER AMENDMENT D421 (2026-10-15, tag resolve-contract-amended2-20261015): rule 1 normalizes like verified-question lookup
# (NFKC, lower-case) and keeps every non-whitespace run containing a non-ASCII character as an unmatched word. Cases AMD5–AMD8
# added; no earlier case changes (none has a non-ASCII question). File is UTF-8.
